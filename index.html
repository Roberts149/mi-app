<script>
    // --- FUNCIÓN RESTAURAR LISTA (CORREGIDA) ---
    function restaurarLista() {
        const input = prompt("Pega aquí el texto guardado:");
        if (input) {
            try {
                // Limpia espacios al inicio y final
                let cleanInput = input.trim();
                
                // Reemplaza múltiples espacios por uno solo
                cleanInput = cleanInput.replace(/\s+/g, ' ');
                
                // Intenta parsear
                const list = JSON.parse(cleanInput);
                
                // Verifica que sea un array
                if (!Array.isArray(list)) {
                    throw new Error("No es una lista válida");
                }
                
                window.playlistItems = list;
                alert(`✅ Restaurados ${list.length} canales.`);
                location.reload();
            } catch(e) {
                alert("❌ Texto no válido. Asegúrate de copiar todo el bloque desde '{' hasta '}' sin dejar espacios sueltos.");
            }
        }
    }

<script>
    // --- FUNCIÓN RESTAURAR LISTA (CORREGIDA) ---
    function restaurarLista() {

        if (input) {

                let cleanInput = input.trim();

                if (!Array.isArray(list)) {

            }
        }

    // --- FUNCIÓN BUSCAR CANALES (COMPLETA) ---
    function buscarCanales() {
        const texto = document.getElementById('busqueda').value.toLowerCase();
        const canales = document.querySelectorAll('.canal-item'); 
        
        canales.forEach(canal => {
            const nombreElemento = canal.querySelector('.nombre-canal') || canal; 
            const nombre = nombreElemento.innerText.toLowerCase();
            
            if (nombre.includes(texto)) {
                canal.style.display = 'block';
            } else {
                canal.style.display = 'none';
            }
        });
    }

    // --- FUNCIÓN GUARDAR LISTA ORIGINAL ---
    function guardarLista() {
        const items = window.playlistItems || []; 
        if(items.length === 0) return alert("La lista está vacía");
        
        const data = JSON.stringify(items, null, 2);
        navigator.clipboard.writeText(data).then(() => {
            alert("✅ ¡Lista copiada! Pégala en un bloc de notas.");
        }).catch(() => {
            prompt("Copia esto manualmente:", data);
        });
    }
</script>
