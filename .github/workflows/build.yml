name: Compilar APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Preparar para Google TV y http
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' $M
      - name: Icono, banner y pantalla de inicio
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          import os,glob,random
          from PIL import Image,ImageDraw,ImageFont
          R='android/app/src/main/res'
          def F(s):
              for p in ['/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf','/usr/share/fonts/truetype/liberation/LiberationSerif-Bold.ttf']:
                  if os.path.exists(p): return ImageFont.truetype(p,s)
              return ImageFont.load_default()
          def art(S,bg=True):
              im=Image.new('RGBA',(S,S),(5,5,5,255) if bg else (0,0,0,0)); d=ImageDraw.Draw(im); r=random.Random(7); c=S/2
              for i in range(15):
                  x=c+(i-7)*S*0.034; t=S*0.16+r.random()*S*0.05; b=S*(0.50+r.random()*0.16)
                  d.line([(x,t),(x,b)],fill=(214,170,70,int(90+r.random()*140)),width=max(1,int(S*0.012)))
              f=F(int(S*0.40)); w=d.textlength('M',font=f); d.text((c-w/2,S*0.40),'M',font=f,fill=(244,223,155,255))
              return im
          def circ(im):
              m=Image.new('L',im.size,0); ImageDraw.Draw(m).ellipse([0,0,im.size[0]-1,im.size[1]-1],fill=255); o=im.copy(); o.putalpha(m); return o
          for n,(a,b) in {'mdpi':(48,108),'hdpi':(72,162),'xhdpi':(96,216),'xxhdpi':(144,324),'xxxhdpi':(192,432)}.items():
              d=R+'/mipmap-'+n
              if not os.path.isdir(d): continue
              art(a).convert('RGB').save(d+'/ic_launcher.png'); circ(art(a)).save(d+'/ic_launcher_round.png')
              fg=Image.new('RGBA',(b,b),(0,0,0,0)); k=int(b*0.62); fg.paste(art(k,False),((b-k)//2,(b-k)//2)); fg.save(d+'/ic_launcher_foreground.png')
          bgx=R+'/values/ic_launcher_background.xml'
          open(bgx,'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#050505</color>\n</resources>\n')
          ban=Image.new('RGB',(320,180),(5,5,5)); d=ImageDraw.Draw(ban); r=random.Random(3)
          for i in range(30):
              x=40+i*8; d.line([(x,0),(x,60+r.random()*60)],fill=(214,170,70),width=1)
          f=F(30); t='MRCASCADAS'; d.text(((320-d.textlength(t,font=f))/2,92),t,font=f,fill=(244,223,155)); f=F(20); t='IPTV'; d.text(((320-d.textlength(t,font=f))/2,134),t,font=f,fill=(214,170,70))
          os.makedirs(R+'/drawable',exist_ok=True); ban.save(R+'/drawable/banner.png')
          for p in glob.glob(R+'/drawable*/splash.png'):
              w,h=Image.open(p).size; s=Image.new('RGB',(w,h),(5,5,5)); d=ImageDraw.Draw(s); f=F(max(14,w//12)); t='MRCASCADAS IPTV'; d.text(((w-d.textlength(t,font=f))/2,h/2-w//24),t,font=f,fill=(244,223,155)); s.save(p)
          m='android/app/src/main/AndroidManifest.xml'; x=open(m).read()
          if 'android:banner' not in x: open(m,'w').write(x.replace('<application','<application android:banner="@drawable/banner"',1))
          PY
      - run: npx cap sync android
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MRCASCADAS-IPTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar enlace fijo para Downloader
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: MRCASCADAS IPTV (ultima version)
          files: android/app/build/outputs/apk/debug/app-debug.apk
