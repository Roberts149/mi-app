
name: Compilar APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Arreglar animaciones
        run: |
          sed -i '/^[[:space:]]*var reduce=false;[[:space:]]*$/d' www/index.html
          sed -i "s/matchMedia('(prefers-reduced-motion: reduce)').matches/false/" www/index.html
      - name: Ajustar presentacion
        run: |
          python3 - <<'PY'
          p='www/index.html'
          s=open(p,encoding='utf-8').read()
          reps=[
          ("font-size:clamp(34px,9vw,92px);letter-spacing:.14em","font-size:clamp(26px,7.2vw,92px);letter-spacing:.08em"),
          ("letter-spacing:.4em}to{opacity:1;transform:none;filter:none;letter-spacing:.14em}","letter-spacing:.25em}to{opacity:1;transform:none;filter:none;letter-spacing:.08em}"),
          ("rgba(255,240,190,'+d.a+')","rgba(214,170,70,'+(d.a*.55)+')"),
          ("Math.min(14,2+Math.floor(mist/40))","Math.min(6,2+Math.floor(mist/70))"),
          ("W*(.34+Math.min(.2,mist/9000))","W*(.28+Math.min(.1,mist/12000))"),
          ("w:.6+Math.random()*1.8","w:.5+Math.random()*1.0"),
          ("fillStyle='rgba(5,5,5,.2)'","fillStyle='rgba(5,5,5,.3)'"),
          ]
          for a,b in reps:
              if a in s:
                  s=s.replace(a,b)
                  print('OK',a[:40])
              else:
                  print('FALTA',a[:40])
          open(p,'w',encoding='utf-8').write(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Preparar para Google TV
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />#<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' $M
      - run: npx cap sync android
      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MRCASCADAS-IPTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar enlace fijo para Downloader
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: MRCASCADAS IPTV (ultima version)
          files: android/app/build/outputs/apk/debug/app-debug.apk
