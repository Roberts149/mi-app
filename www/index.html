<!DOCTYPE html>

<style>
:root{--g:#d6b45b;--g2:#f4df9b;--line:#4d3f1d;--mut:#a9a396}
*{box-sizing:border-box}html,body{margin:0;background:#050505}
body{background:radial-gradient(ellipse at top,#262012 0,#070707 55%);color:#f7f2e5;font:16px/1.4 "Trebuchet MS",Arial,sans-serif;min-height:100vh}
.hidden{display:none!important}.muted{color:var(--mut);font-size:13px}
.mas{width:clamp(120px,32vw,200px);height:auto;margin:0 auto 6px;display:block;opacity:0;animation:fd 1s .3s forwards,fl 3s 1.3s ease-in-out infinite;filter:drop-shadow(0 0 18px #d6b45b88)}
@keyframes fl{50%{transform:translateY(-10px)}}
.bk{transform-box:fill-box;transform-origin:center;animation:bk 4s 2s infinite}
@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wv{transform-box:fill-box;transform-origin:100% 100%;animation:wv .9s 1.5s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-12deg)}to{transform:rotate(20deg)}}
#intro{position:fixed;inset:0;z-index:50;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;transition:opacity .9s,transform .9s}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#fall{position:absolute;inset:0;width:100%;height:100%}
.ib{position:relative;z-index:2;padding:0 6vw}
.logo{font-family:Georgia,serif;font-weight:700;font-size:clamp(26px,7.2vw,92px);letter-spacing:.08em;line-height:1.05;margin:0;background:linear-gradient(100deg,#8a6420 0%,#f4df9b 40%,#fff6d0 50%,#d6b45b 62%,#8a6420 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:li 1.6s .9s forwards,sh 4s 2.4s linear infinite}
.tag{color:#cdb877;letter-spacing:.3em;font-size:clamp(11px,2.3vw,16px);margin:18px 0 0;opacity:0;animation:fd 1.2s 2.1s forwards}
.go{margin-top:38px;opacity:0;animation:fd 1s 3s forwards}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3}
@keyframes li{from{opacity:0;transform:translateY(-24px);filter:blur(10px);letter-spacing:.25em}to{opacity:1;transform:none;filter:none;letter-spacing:.08em}}
@keyframes sh{to{background-position:-250% 0}}@keyframes fd{to{opacity:1}}
button,select,input{font:inherit}
button{background:linear-gradient(135deg,#f0d98d,#a77c25);color:#15110a;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}
button.s{background:#221f17;color:var(--g2);border:1px solid #8f7133}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff1b8;outline-offset:2px}
input,select{width:100%;background:#090909;border:1px solid #62512a;border-radius:10px;padding:12px;color:#fff;margin:6px 0}
.view{min-height:100vh;padding:calc(12px + env(safe-area-inset-top,0px)) 4vw 40px}
.brand{font-family:Georgia,serif;font-weight:700;letter-spacing:.12em;color:var(--g2);font-size:clamp(20px,5vw,30px)}
.pill{border:1px solid var(--g);color:var(--g2);border-radius:30px;padding:3px 10px;font-size:11px;margin-left:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.src{display:flex;gap:10px;align-items:center;background:#15130e;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.src b{color:var(--g2);display:block}
.top{position:sticky;top:0;z-index:5;background:#070707ee;padding:8px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.tabs button{flex:0 0 auto}
.tabs button.on,.chip.on{background:linear-gradient(135deg,#f0d98d,#a77c25);color:#15110a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{flex:0 0 auto;padding:7px 13px;font-size:13px;background:#221f17;color:var(--g2);border:1px solid #8f7133}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:10px 0}
.card{position:relative}
.cm{width:100%;min-height:110px;background:#1a1810;color:var(--g2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cm img{width:56px;height:56px;object-fit:contain}.cm span{overflow-wrap:anywhere}
.fav{position:absolute;top:2px;right:2px;padding:2px 7px;font-size:18px;background:#0008;color:var(--g2);border-radius:8px}
#vPlayer{padding:0;background:#000}
#vid{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
#pl .bar{position:fixed;left:0;right:0;display:flex;gap:10px;align-items:center;padding:12px 4vw;background:#000a;transition:opacity .3s;opacity:0}
#pl.show .bar{opacity:1}#pl .t{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}#pl .b{bottom:0;justify-content:center}
#pm{position:fixed;top:45%;left:0;right:0;text-align:center;color:var(--g2);text-shadow:0 0 8px #000}
#modal{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#121212;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:640px;max-height:86vh;overflow:auto}
.sheet h3{margin:0 0 8px;color:var(--g2);font-family:Georgia,serif}.sheet h4{color:var(--g);margin:14px 0 6px}
.ep{display:block;width:100%;text-align:left;margin:5px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:#1d1810;border:1px solid var(--g);color:var(--g2);padding:10px 18px;border-radius:30px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="intro">
<canvas id="fall"></canvas>
<button class="s skip" id="skip">Omitir</button>
<div class="ib"><svg class="mas" viewBox="0 -20 200 240" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6d0"/><stop offset=".45" stop-color="#f4df9b"/><stop offset=".8" stop-color="#d6b45b"/><stop offset="1" stop-color="#a77c25"/></linearGradient></defs>

<path class="wv" d="M34 150Q8 142 14 116" fill="none" stroke="#d6b45b" stroke-width="9" stroke-linecap="round"/>
<path d="M166 150Q192 160 186 180" fill="none" stroke="#d6b45b" stroke-width="9" stroke-linecap="round"/>

<ellipse cx="68" cy="95" rx="9" ry="20" fill="#fff" opacity=".35" transform="rotate(25 68 95)"/>

<circle cx="58" cy="152" r="9" fill="#e8a76a" opacity=".5"/><circle cx="142" cy="152" r="9" fill="#e8a76a" opacity=".5"/>
<path d="M78 158Q100 184 122 158" fill="none" stroke="#15110a" stroke-width="5" stroke-linecap="round"/></svg>
<h1 class="logo">MRCASCADAS</h1>
<div class="logo" style="font-size:clamp(18px,4.5vw,40px);letter-spacing:.7em;margin-top:6px;animation-delay:1.3s,2.8s">IPTV</div>
<p class="tag">TU TELEVISIÓN, A TU MANERA</p><button class="go" id="enter">ENTRAR</button></div>
</div>

<div id="app">
<section id="vHome" class="view">
<div class="row"><span class="brand">MRCASCADAS IPTV</span><span class="pill">PRO</span></div>
<h2 style="font-family:Georgia,serif;color:#f4df9b;margin:20px 0 4px">Mis listas</h2>

</div>

</section>

<section id="vPlayer" class="view hidden"><div id="pl">

<div class="bar b"><button class="s" id="pp">⏮</button><button class="s" id="pq">⏯</button><button class="s" id="pn">⏭</button><button class="s" id="pz">⛶ Ajustar</button></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},LS=window.localStorage,Cap=window.Capacitor;
function jget(k,d){try{var v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}}
function jset(k,v){try{LS.setItem(k,JSON.stringify(v))}catch(e){toast('No se pudo guardar')}}
function toast(s){var t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(function(){t.classList.remove('show')},2400)}

/* ---- Cascada dorada ---- */
var cv=$('fall'),ctx=cv.getContext('2d'),W,H,drops=[],raf,run=true,mist=0;
function size(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H)}
function spawn(){var band=W*(.28+Math.min(.1,mist/12000)),x=W/2+(Math.random()-.5)*band*(Math.random()<.2?1.6:1);drops.push({x:x,y:-20,v:3+Math.random()*5,l:30+Math.random()*90,a:.25+Math.random()*.6,w:.5+Math.random()})}
function frame(){if(!run)return;mist++;ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(5,5,5,.3)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
var n=Math.min(6,2+Math.floor(mist/70)),i,fl=H*.8;for(i=0;i<n;i++)spawn();
for(i=drops.length-1;i>=0;i--){var d=drops[i];d.y+=d.v;var g=ctx.createLinearGradient(0,d.y-d.l,0,d.y);g.addColorStop(0,'rgba(214,180,91,0)');g.addColorStop(1,'rgba(214,170,70,'+d.a*.55+')');ctx.strokeStyle=g;ctx.lineWidth=d.w;ctx.beginPath();ctx.moveTo(d.x,d.y-d.l);ctx.lineTo(d.x,d.y);ctx.stroke();
if(d.y>fl){if(Math.random()<.35){ctx.fillStyle='rgba(244,223,155,'+d.a*.5+')';ctx.beginPath();ctx.arc(d.x+(Math.random()-.5)*40,fl-Math.random()*14,Math.random()*2+.5,0,6.3);ctx.fill()}drops.splice(i,1)}}
var m=ctx.createRadialGradient(W/2,fl,0,W/2,fl,W*.42);m.addColorStop(0,'rgba(244,223,155,'+(.14+Math.sin(mist/30)*.04)+')');m.addColorStop(1,'rgba(214,180,91,0)');ctx.fillStyle=m;ctx.fillRect(0,fl-W*.42,W,W*.6);raf=requestAnimationFrame(frame)}
size();window.addEventListener('resize',size);frame();
var canEnter=false,closed=false;setTimeout(function(){canEnter=true},3000);
function closeIntro(){if(closed)return;closed=true;$('intro').classList.add('out');setTimeout(function(){run=false;cancelAnimationFrame(raf);$('intro').remove();boot()},800)}
$('enter').onclick=closeIntro;$('skip').onclick=closeIntro;
$('intro').addEventListener('click',function(e){if(canEnter&&e.target.tagName!=='BUTTON')closeIntro()});
$('enter').focus({preventScroll:true});

/* ---- Cache (IndexedDB) y red ---- */
var dbp;function db(){return dbp||(dbp=new Promise(function(ok,no){var r=indexedDB.open('mrc',1);r.onupgradeneeded=function(){r.result.createObjectStore('c')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}))}
function cget(k){return db().then(function(d){return new Promise(function(ok){var q=d.transaction('c').objectStore('c').get(k);q.onsuccess=function(){ok(q.result)};q.onerror=function(){ok()}})}).catch(function(){})}
function cset(k,v){return db().then(function(d){d.transaction('c','readwrite').objectStore('c').put(v,k)}).catch(function(){})}
function http(u){var H=Cap&&Cap.Plugins&&Cap.Plugins.CapacitorHttp,f=function(){return fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})};
if(!H)return f();return H.get({url:u,responseType:'text',connectTimeout:20000,readTimeout:90000}).then(function(r){if(r.status<200||r.status>=300)throw new Error('HTTP '+r.status);return typeof r.data==='string'?r.data:JSON.stringify(r.data)}).catch(function(e){return f().catch(function(){throw e})})}

/* ---- Datos ---- */
function parseM3U(t){var out=[],m=null;t.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(function(r){var l=r.trim();if(!l)return;
if(l.indexOf('#EXTINF')===0){var c=l.lastIndexOf(',');m={n:c>=0?l.slice(c+1).trim():'Canal',g:(l.match(/group-title="([^"]*)"/i)||[])[1]||'General',l:(l.match(/tvg-logo="([^"]*)"/i)||[])[1]||''}}
else if(l[0]!=='#'&&/^https?:\/\//i.test(l)){m=m||{n:'Canal '+(out.length+1),g:'General',l:''};out.push({k:'m'+out.length,n:m.n,g:m.g,l:m.l,u:l,t:/\/movie\//.test(l)?'vod':/\/series\//.test(l)?'series':'live'});m=null}});return out}
function fromM3U(a){var d={live:{i:[],c:[]},vod:{i:[],c:[]},series:{i:[],c:[]}};a.forEach(function(x){d[x.t].i.push(x)});
Object.keys(d).forEach(function(t){var s={};d[t].i.forEach(function(x){s[x.g]=1});d[t].c=Object.keys(s).sort().map(function(n){return{id:n,name:n}})});return d}
function xapi(s,a,x){return http(s.server+'/player_api.php?username='+encodeURIComponent(s.user)+'&password='+encodeURIComponent(s.pass)+(a?'&action='+a:'')+(x||'')).then(JSON.parse)}
function xtype(s,t){var A={live:['get_live_categories','get_live_streams'],vod:['get_vod_categories','get_vod_streams'],series:['get_series_categories','get_series']}[t];
return Promise.all([xapi(s,A[0]),xapi(s,A[1])]).then(function(r){var c=Array.isArray(r[0])?r[0]:[],i=Array.isArray(r[1])?r[1]:[];
return{c:c.map(function(x){return{id:String(x.category_id),name:x.category_name}}),i:i.map(function(x){var id=x.stream_id||x.series_id;return{k:t+id,n:x.name,g:String(x.category_id),l:x.stream_icon||x.cover||'',t:t,id:id,e:x.container_extension}})}})}
function urlOf(x){if(x.u)return x.u;var s=S.src,p=x.t==='live'?'live':x.t==='vod'?'movie':'series';return s.server+'/'+p+'/'+encodeURIComponent(s.user)+'/'+encodeURIComponent(s.pass)+'/'+x.id+(x.t==='live'?'.m3u8':'.'+(x.e||'mp4'))}

/* ---- Estado, listas, favoritos ---- */
var S={src:null,data:{},tab:'live',cat:'*',q:'',shown:60,list:[],force:false},srcs=jget('mrc.s',[]),V='home',modalOpen=false,popCb=null;
function favs(){return S.src?jget('mrc.f.'+S.src.id,[]):[]}
function recs(){return S.src?jget('mrc.r.'+S.src.id,[]):[]}
function addRecent(x){if(!S.src)return;var a=recs().filter(function(r){return r.k!==x.k});a.unshift(x);jset('mrc.r.'+S.src.id,a.slice(0,30))}
function pos(){return S.src?jget('mrc.p.'+S.src.id,{}):{}}
function savePos(x,t){var p=pos();if(t>10)p[x.k]=Math.floor(t);else delete p[x.k];jset('mrc.p.'+S.src.id,p)}
function fmt(s){var m=Math.floor(s/60),h=Math.floor(m/60);m=m%60;s=Math.floor(s%60);return(h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s}
function isFav(x){return favs().some(function(f){return f.k===x.k})}
function toggleFav(x){var a=favs(),i=a.findIndex(function(f){return f.k===x.k});if(i>=0)a.splice(i,1);else a.push(x);jset('mrc.f.'+S.src.id,a);toast(i>=0?'Quitado de favoritos':'Agregado a favoritos ★')}

/* ---- Navegación (el botón Atrás de Android funciona) ---- */
function show(v){V=v;['Home','Browse','Player'].forEach(function(n){$('v'+n).classList.toggle('hidden',n.toLowerCase()!==v)});if(v!=='player'){P.tok++;kill()}else showCtl()}
function go(v){history.pushState({v:v},'');show(v)}
window.onpopstate=function(e){if(popCb){var c=popCb;popCb=null;c();return}if(modalOpen){modalOpen=false;$('modal').classList.add('hidden');return}show((e.state&&e.state.v)||'home')};
function sheet(){var s=$('sheet');s.textContent='';$('modal').classList.remove('hidden');modalOpen=true;history.pushState({v:V},'');return s}
function hideSheet(cb){modalOpen=false;$('modal').classList.add('hidden');popCb=cb||function(){};history.back()}
$('modal').onclick=function(e){if(e.target===this)hideSheet()};

/* ---- Inicio ---- */
function renderHome(){var h=$('srcs');h.textContent='';$('auto').checked=LS.getItem('mrc.auto')!=='0';
if(!srcs.length){var p=document.createElement('p');p.className='muted';p.textContent='Aún no tienes listas. Toca “Agregar lista”.';h.append(p)}
srcs.forEach(function(s){var d=document.createElement('div');d.className='src';var i=document.createElement('div');i.className='sp';var b=document.createElement('b');b.textContent=s.name;var m=document.createElement('span');m.className='muted';m.textContent=s.type==='x'?'Xtream Codes':s.type==='u'?'Lista M3U (enlace)':'Lista M3U (archivo)';i.append(b,m);
var o=document.createElement('button');o.textContent='Entrar';o.onclick=function(){openSource(s)};var x=document.createElement('button');x.className='s';x.textContent='🗑';x.onclick=function(){if(confirm('¿Eliminar "'+s.name+'"?')){srcs=srcs.filter(function(y){return y.id!==s.id});jset('mrc.s',srcs);LS.removeItem('mrc.f.'+s.id);renderHome()}};d.append(i,o,x);h.append(d)})}
$('auto').onchange=function(){LS.setItem('mrc.auto',this.checked?'1':'0')};
$('add').onclick=addForm;
function boot(){history.replaceState({v:'home'},'');renderHome();show('home');var l=LS.getItem('mrc.last'),s=srcs.filter(function(x){return x.id===l})[0];
if(!srcs.length)addForm();else if(s&&LS.getItem('mrc.auto')!=='0')openSource(s);else $('add').focus()}

function addForm(){var s=sheet();s.innerHTML='<h3>Agregar lista</h3><select id="ft"><option value="x">Xtream Codes (usuario y contraseña)</option><option value="u">Lista M3U por enlace</option><option value="f">Lista M3U desde archivo</option></select><input id="fn" placeholder="Nombre (ej. Mi televisión)" maxlength="40"><div id="fx"><input id="fs" placeholder="Servidor: http://servidor:puerto" inputmode="url"><input id="fu" placeholder="Usuario" autocomplete="off"><div class="row"><input id="fp" class="sp" type="password" placeholder="Contraseña"><button class="s" id="eye" type="button">👁</button></div></div><input id="fl" class="hidden" placeholder="https://servidor/lista.m3u" inputmode="url"><input id="ff" class="hidden" type="file"><button id="fok" style="width:100%;margin-top:8px">Guardar y entrar</button><p id="fm" class="muted"></p>';
$('eye').onclick=function(){var p=$('fp');p.type=p.type==='password'?'text':'password'};
$('ft').onchange=function(){var t=this.value;$('fx').classList.toggle('hidden',t!=='x');$('fl').classList.toggle('hidden',t!=='u');$('ff').classList.toggle('hidden',t!=='f')};

<div style="margin-top:20px;text-align:center;">
    <button onclick="guardar()" style="background:#4CAF50;color:white;padding:10px;border:none;border-radius:5px;margin:5px;">💾 Guardar Lista</button>
    <button onclick="restaurar()" style="background:#2196F3;color:white;padding:10px;border:none;border-radius:5px;margin:5px;">📂 Restaurar Lista</button>
</div>

<script>
function guardar() {
    // Ajusta 'playlistItems' si tu variable se llama diferente
    let lista = window.playlistItems || []; 
    if(lista.length == 0) alert("No hay canales para guardar");
    
    let texto = JSON.stringify(lista);
    navigator.clipboard.writeText(texto).then(() => {
        alert("✅ ¡Lista copiada! Ahora pégala donde quieras.");
    }).catch(() => {
        prompt("Copia esto manualmente:", texto);
    });
}

function restaurar() {
    let texto = prompt("Pega aquí el texto guardado:");
    if(texto) {
        try {
            let nuevaLista = JSON.parse(texto);
            window.playlistItems = nuevaLista;
            alert("✅ ¡Lista restaurada! Recargando...");
            location.reload();
        } catch(e) {
            alert("❌ Error al leer el texto.");
        }
    }
}
</script></body>
