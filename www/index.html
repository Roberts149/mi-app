<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRCASCADAS IPTV</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: #fff; font-family: sans-serif; }
        header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 2px solid #d6b45b; }
        h1 { margin: 0; color: #d6b45b; font-size: 1.2rem; }
        #mainList { padding: 10px; }
        .cm { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; background: #1e1e1e; margin-bottom: 5px; border-radius: 5px; }
        .cm:hover { background: #2a2a2a; }
        #playerContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; }
        video { width: 100%; height: 100%; }
        #closeBtn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 5px 10px; cursor: pointer; z-index: 101; }
    </style>
</head>
<body>
    <header><h1>MRCASCADAS IPTV</h1></header>
    <div id="mainList"></div>
    <div id="playerContainer">
        <button id="closeBtn" onclick="closePlayer()">Cerrar X</button>
        <video id="videoPlayer" controls autoplay></video>
    </div>
    <script>
        fetch('peliculas.m3u').then(r => r.text()).then(data => {
            let title = '';
            data.split('\n').forEach(line => {
                if (line.startsWith('#')) {
                    if (line.includes('tvg-name="')) title = line.match(/tvg-name="([^"]+)"/)[1];
                } else if (line.startsWith('http')) {
                    addMovie(title || 'Sin título', line);
                    title = '';
                }
            });
        });
        function addMovie(name, url) {
            const div = document.createElement('div');
            div.className = 'cm';
            div.textContent = name;
            div.onclick = () => play(url);
            document.getElementById('mainList').appendChild(div);
        }
        function play(url) {
            document.getElementById('mainList').style.display = 'none';
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('videoPlayer').src = url;
            document.getElementById('videoPlayer').play();
        }
        function closePlayer() {
            document.getElementById('mainList').style.display = 'block';
            document.getElementById('playerContainer').style.display = 'none';
            document.getElementById('videoPlayer').pause();
        }
    </script>
</body>
</html>
